<!doctype html>
<meta charset="utf-8">
<title>Build the satellite texture</title>
<!--
  Builds assets/terrain/satellite.jpg (and a smaller copy for phones) from
  Sentinel-2 cloudless 2016 tiles by EOX IT Services GmbH, licensed CC BY 4.0
  (contains modified Copernicus Sentinel data 2016). The 2016 layer is used on
  purpose: later years are CC BY-NC-SA and may not be used commercially.

  Run `node tools/serve.mjs`, open /tools/satellite.html, and wait for "done".
-->
<pre id="log">working…</pre>
<script type="module">
  const log = (t) => (document.querySelector('#log').textContent += '\n' + t);
  const meta = await (await fetch('../data/terrain.json')).json();
  const { west, east, south, north } = meta.bbox;
  const LAYER = 's2cloudless_3857';
  const zoom = 12, n = 2 ** zoom;
  const tx = (lon) => Math.floor(((lon + 180) / 360) * n);
  const ty = (lat) => {
    const r = (lat * Math.PI) / 180;
    return Math.floor(((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * n);
  };
  const tileLon = (x) => (x / n) * 360 - 180;
  const tileLat = (y) => (Math.atan(Math.sinh(Math.PI * (1 - (2 * y) / n))) * 180) / Math.PI;
  const W = 4096, H = Math.round((W * meta.heightKm) / meta.widthKm);
  const canvas = Object.assign(document.createElement('canvas'), { width: W, height: H });
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  const load = (url) =>
    new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(url));
      img.src = url;
    });
  const jobs = [];
  for (let y = ty(north); y <= ty(south); y++) for (let x = tx(west); x <= tx(east); x++) jobs.push([x, y]);
  let failed = 0;
  for (let i = 0; i < jobs.length; i += 8) {
    await Promise.all(
      jobs.slice(i, i + 8).map(async ([x, y]) => {
        try {
          const img = await load(`https://tiles.maps.eox.at/wmts/1.0.0/${LAYER}/default/g/${zoom}/${y}/${x}.jpg`);
          const x0 = ((tileLon(x) - west) / (east - west)) * W, x1 = ((tileLon(x + 1) - west) / (east - west)) * W;
          const y0 = ((north - tileLat(y)) / (north - south)) * H, y1 = ((north - tileLat(y + 1)) / (north - south)) * H;
          ctx.drawImage(img, x0, y0, x1 - x0 + 0.6, y1 - y0 + 0.6);
        } catch {
          failed++;
        }
      }),
    );
  }
  log(`${jobs.length} tiles, ${failed} failed`);
  const save = async (source, name, quality) => {
    const blob = await new Promise((r) => source.toBlob(r, 'image/jpeg', quality));
    const res = await fetch(`../assets/terrain/${name}`, { method: 'PUT', body: blob });
    log(`${name}: ${source.width}x${source.height}, ${(blob.size / 1024).toFixed(0)} KB, HTTP ${res.status}`);
  };
  await save(canvas, 'satellite.jpg', 0.8);
  const small = Object.assign(document.createElement('canvas'), { width: 2048, height: Math.round(H / 2) });
  const sctx = small.getContext('2d');
  sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(canvas, 0, 0, small.width, small.height);
  await save(small, 'satellite-small.jpg', 0.78);
  log(failed ? 'finished with missing tiles' : 'done');
  window.__done = true;
</script>
