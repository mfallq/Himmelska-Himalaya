<!doctype html>
<meta charset="utf-8">
<title>Build the app icons</title>
<!-- iOS needs PNG icons for the Home Screen. This draws assets/icons/icon.svg
     at 180 and 512 pixels and saves both through the dev server.
     Run `node tools/serve.mjs` and open /tools/icons.html. -->
<pre id="log">working…</pre>
<script type="module">
  const log = (t) => (document.querySelector('#log').textContent += '\n' + t);
  const svg = await (await fetch('../assets/icons/icon.svg')).text();
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  for (const size of [180, 512]) {
    const c = Object.assign(document.createElement('canvas'), { width: size, height: size });
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#0a1217'; // iOS adds its own rounded corners, so fill the square
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
    const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    const res = await fetch(`../assets/icons/icon-${size}.png`, { method: 'PUT', body: blob });
    log(`icon-${size}.png: ${(blob.size / 1024).toFixed(1)} KB, HTTP ${res.status}`);
  }
  log('done');
</script>
